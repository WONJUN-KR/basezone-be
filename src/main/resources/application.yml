spring:
  application:
    name: ballpark
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5450/ballpark}
    username: ${DB_USER:ballpark}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
